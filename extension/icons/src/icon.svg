<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE047"/>
      <stop offset="1" stop-color="#FACC15"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded background -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bg)"/>
  
  <!-- Subtle glow -->
  <circle cx="64" cy="64" r="50" fill="url(#gold)" opacity="0.15"/>
  
  <!-- Ear (simplified, right-facing profile) -->
  <path d="M88,48 C88,38 96,32 104,36 C110,39 112,48 110,56 C108,62 100,64 94,62 C90,60 88,54 88,48 Z" fill="#E8B4B4" opacity="0.9"/>
  <path d="M94,50 C96,52 98,54 98,56 C98,58 96,60 94,58" fill="none" stroke="#D4A0A0" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Whisper arcs entering the ear (3 concentric arcs) -->
  <path d="M70,48 A18,18 0 0 1 70,64" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M64,44 A24,24 0 0 1 64,68" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M58,40 A30,30 0 0 1 58,72" fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Sathi (the whispering friend/sparkle) - left side -->
  <!-- Main star shape -->
  <path d="M28,56 L31,60 L37,60 L32,63 L34,69 L28,65 L22,69 L24,63 L19,60 L25,60 Z" fill="url(#gold)"/>
  <path d="M28,58 L30,60.5 L33,60.5 L30.5,62 L31.5,65.5 L28,63 L24.5,65.5 L25.5,62 L23,60.5 L26.5,60.5 Z" fill="#FFF7AE"/>
  
  <!-- Small accent sparkles around the sathi -->
  <circle cx="18" cy="52" r="2" fill="#FDE047" opacity="0.8"/>
  <circle cx="16" cy="68" r="1.5" fill="#FDE047" opacity="0.6"/>
  <circle cx="40" cy="50" r="1.5" fill="#FDE047" opacity="0.7"/>
  <circle cx="42" cy="70" r="2" fill="#FDE047" opacity="0.5"/>
  
  <!-- Tiny sparkle near ear (receiving the whisper) -->
  <path d="M100,46 L101.5,48.5 L104,48.5 L102,50 L103,52.5 L100,51 L97,52.5 L98,50 L96,48.5 L98.5,48.5 Z" fill="#FDE047" opacity="0.7"/>
</svg>